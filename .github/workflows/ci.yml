name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      # Puppeteer is a devDependency used only by scripts/run-axe-audit.mjs and
      # scripts/capture-landing-screenshots.mjs, neither of which runs here. Its
      # postinstall downloads ~150MB of Chromium on every run and intermittently
      # fails the whole build on a network hiccup — which is exactly what it did.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Theme token guard (no hardcoded light surfaces)
        run: |
          set -e
          PATTERN='bg-white|bg-gray-50|bg-slate-50|text-white|text-black'
          if rg -n "$PATTERN" components app lib/ui --glob '*.{tsx,ts}' 2>/dev/null; then
            echo "::error::Hardcoded colour classes found — use theme tokens (var(--surface-*), etc.)"
            exit 1
          fi
          TRAFFIC_PATTERN='bg-(amber|emerald|green)-[0-9]'
          if rg -n "$TRAFFIC_PATTERN" components/planner lib/planner --glob '*.{tsx,ts}' 2>/dev/null; then
            echo "::error::Hardcoded traffic/status colours in planner — use ds.traffic* or --semantic-* tokens"
            exit 1
          fi
          echo "Theme token guard passed"

      # Fastest, broadest signal first so failures surface early.
      - name: Type check
        run: npx tsc --noEmit

      - name: Plan calorie band verification
        run: npx tsx scripts/verify-plan-calorie-bands.ts

      - name: Nutrition regression tests
        run: npm run test:nutrition

      # Covers recipe coherence, dedupe, method steps, and pantry matching.
      - name: Planner and recipe regression tests
        run: npm run test:planner

      - name: Auth regression tests
        run: npm run test:auth

      # Unmatched foods contribute zero to the weekly analysis rather than
      # reporting as unknown, so a coverage gap reads as a deficiency. Renaming
      # "buckwheat groats" to "buckwheat" broke this and nothing caught it.
      - name: Micronutrient coverage
        run: npm run verify:micro-coverage

      - name: Meal template coherence
        run: npm run verify:meal-templates

      - name: Meal template goal targeting
        run: npm run verify:meal-template-goals

      - run: npm run lint
