<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BiteSync</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d2923; color: #f7f5ee; text-align: center;
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      box-sizing: border-box;
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #a9c2b8; margin: 0 0 24px; }
    button {
      font: inherit; font-weight: 700; color: #0d2923; background: #dff36e;
      border: 0; border-radius: 999px; padding: 14px 28px; min-height: 48px;
    }
    /* With a saved grocery list, the page reads top to bottom instead. */
    body.has-list { display: block; text-align: left; padding-top: calc(env(safe-area-inset-top) + 24px); }
    body.has-list main { max-width: 560px; margin: 0 auto; }
    #list { margin: 0 0 32px; padding: 16px 20px; border-radius: 20px; background: #f7f5ee; color: #0d2923; }
    #list h2 { font-size: 20px; margin: 0; }
    #list .week { color: #0a7a58; margin: 0 0 4px; font-size: 15px; }
    #list h3 { font-size: 13px; letter-spacing: 0.06em; color: #0a7a58; margin: 16px 0 4px; }
    #list ul { list-style: none; margin: 0; padding: 0; }
    #list li { padding: 6px 0; border-bottom: 1px solid #e3e0d4; }
    #list li:last-child { border-bottom: 0; }
    #list .note { color: #4d6b62; font-size: 14px; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>BiteSync needs a connection to load your plan.<br />Check your signal or Wi‑Fi, then try again.</p>
    <section id="list" hidden aria-label="Your grocery list"></section>
    <button type="button" onclick="location.href='https://bitesync.io/today'">Try again</button>
  </main>
  <script>
    // The app saves the grocery list each time it's opened (lib/native/bridge.ts,
    // key "offline-grocery-list"), so it can be read here without a connection.
    (function () {
      var cap = window.Capacitor;
      if (!cap || typeof cap.nativePromise !== "function") return;
      cap.nativePromise("Preferences", "get", { key: "offline-grocery-list" }).then(function (result) {
        var saved = result && result.value ? JSON.parse(result.value) : null;
        if (!saved) return;
        var list = document.getElementById("list");
        function add(parent, tag, text, className) {
          var el = document.createElement(tag);
          el.textContent = text;
          if (className) el.className = className;
          parent.appendChild(el);
          return el;
        }
        if (!saved.text) {
          add(list, "h2", "Grocery list");
          add(list, "p", "Everything on your list was ticked off.", "note");
        } else {
          // groceryShareText: title, week, then a blank line before each aisle,
          // its items as "• …", and a "Planned with BiteSync" line at the end.
          var lines = saved.text.split("\n");
          add(list, "h2", lines[0] || "Grocery list");
          if (lines[1]) add(list, "p", lines[1], "week");
          var ul = null;
          for (var i = 2; i < lines.length; i++) {
            var line = lines[i];
            if (!line || line.indexOf("Planned with BiteSync") === 0) continue;
            if (line.indexOf("• ") === 0) {
              if (!ul) ul = add(list, "ul", "");
              add(ul, "li", line.slice(2));
            } else {
              add(list, "h3", line);
              ul = null;
            }
          }
        }
        var when = new Date(saved.savedAt);
        if (!isNaN(when.getTime())) {
          add(list, "p", "Saved when you last opened your list, " + when.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) + ".", "note");
        }
        list.hidden = false;
        document.body.className = "has-list";
      }).catch(function () {});
    })();
  </script>
</body>
</html>
