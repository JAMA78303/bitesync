<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BiteSync</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d2923; color: #f7f5ee; text-align: center;
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #a9c2b8; margin: 0 0 24px; }
    button {
      font: inherit; font-weight: 700; color: #0d2923; background: #dff36e;
      border: 0; border-radius: 999px; padding: 14px 28px; min-height: 48px;
    }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>BiteSync needs a connection to load your plan.<br />Check your signal or Wi‑Fi, then try again.</p>
    <button type="button" onclick="location.href='https://bitesync.io/today'">Try again</button>
  </main>
</body>
</html>
